<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: white;
      font-size: 36px;
    }

    .role {
      margin: 20px 0;
    }

    .enter-button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #007BFF;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s;
    }

    .enter-button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome! Choose your role</h1>

    <div class="role">
      <h2>Student</h2>
      <button class="enter-button" onclick="window.location.href='student.html'">Enter</button>
    </div>

    <div class="role">
      <h2>Teacher</h2>
      <button class="enter-button" onclick="window.location.href='teacher.html'">Enter</button>
    </div>

    <div class="role">
      <h2>Admin</h2>
      <button class="enter-button" onclick="window.location.href='admin.html'">Enter</button>
    </div>
  </div>
</body>
</html>
